<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاشة العميل / النظام</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="header-top-pro">
          <img src="img/logo.png" alt="logo" />
          <h2>لوحة التحكم</h2>
        </div>
        <button class="headermenu" onclick="togglemenu()">☰</button>
      </div>
      <nav class="menu-total" id="menu-totaltop">
        <button onclick="showsection('home-clian')">الرئيسية</button>
        <button onclick="showsection('data-clian')">بيانات العميل</button>
        <button onclick="showsection('data-market')">المتجر</button>
        <button onclick="showsection('data-basket')">السلة</button>
        <button onclick="logoutClient()">تسجيل خروج</button>
      </nav>
    </header>

    <section id="home-clian">
      <h2>مرحباً بكم</h2>
      <div class="home-1">
        <img src="img/logo.png" alt="صورة اعلان عروض" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">إعلان عروض</h3>
          <button class="home-but1" onclick="showsection('data-market')">دخول للمتجر</button>
        </div>
      </div>
      <div class="home-2">
        <img src="img/logo.png" alt="صورة المتجر" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">المتجر</h3>
          <button class="home-but1" onclick="showsection('data-market')">دخول</button>
        </div>
      </div>
      <div class="home-1">
        <img src="img/logo.png" alt="صورة العميل" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">بيانات العميل</h3>
          <button class="home-but1" onclick="showsection('data-clian')">دخول</button>
        </div>
      </div>
      <div class="home-2">
        <img src="img/logo.png" alt="صورة السلة" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">السلة</h3>
          <button class="home-but1" onclick="showsection('data-basket')">دخول</button>
        </div>
      </div>
    </section>

    <section id="data-clian" style="display: none">
      <h2>بيانات العميل</h2>
      <div class="show-data">
        <label>الاسم</label>
        <span id="data-name">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label>رقم الهاتف</label>
        <span id="data-namber">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label>بريد إلكتروني</label>
        <span id="data-email">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label>العنوان</label>
        <span id="data-addres">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label>الرقم الخاص (ID)</label>
        <span id="data-id">جاري التحميل...</span>
      </div>
    </section>

    <section id="data-market" style="display: none">
      <h2>المتجر</h2>
      <div class="data-market-cardgrop">
        <article class="data-market-card" data-id="A1001">
          <img src="img/logo.png" alt="صنف 1" />
          <div class="incard">
            <h2>صنف 1</h2>
            <p class="price">150 جنيه</p>
            <button class="butmarket" onclick="addToCart(this)">إضافة للسلة</button>
          </div>
        </article>
        <article class="data-market-card" data-id="A1002">
          <img src="img/logo.png" alt="صنف 2" />
          <div class="incard">
            <h2>صنف 2</h2>
            <p class="price">150 جنيه</p>
            <button class="butmarket" onclick="addToCart(this)">إضافة للسلة</button>
          </div>
        </article>
        <article class="data-market-card" data-id="A1003">
          <img src="img/logo.png" alt="صنف 3" />
          <div class="incard">
            <h2>صنف 3</h2>
            <p class="price">150 جنيه</p>
            <button class="butmarket" onclick="addToCart(this)">إضافة للسلة</button>
          </div>
        </article>
      </div>
    </section>

    <section id="data-basket" style="display: none">
      <h2>السلة</h2>
      <form id="basket-form" onsubmit="event.preventDefault()">
        <div id="basket-inmarkrt"></div>
        <div class="basket-total">
          <h3>ملخص الطلب</h3>
          <div class="basket-total2">
            <span>إجمالي الحساب</span>
            <span id="basket-span">0 جنيه</span>
          </div>
          <button type="button" class="but-checkout" onclick="sendInvoiceToWhatsApp()">
            تأكيد الشراء
          </button>
        </div>
      </form>
    </section>

    <script>
      // 🔗 ضع رابط الـ Web App الصحيح هنا (الذي ينتهي بـ /exec)
      const GOOGLE_SCRIPT_URL = "ضع_رابط_الـ_Web_App_هنا";

      // 1. التحقق من تسجيل الدخول
      (function enforceClientAuth() {
        const userRole = (localStorage.getItem("userRole") || "").toLowerCase().trim();
        const userId = localStorage.getItem("userId");

        if (!userId) {
          alert("عذراً، يجب تسجيل الدخول أولاً للوصول إلى هذه الصفحة!");
          window.location.replace("../login/index.html");
        }
      })();

      // 2. جلب البيانات وتحديث السلة بعد تحميل الصفحة
      document.addEventListener("DOMContentLoaded", function () {
        const userId = localStorage.getItem("userId");
        updateBasketUI();

        if (userId) {
          fetchUserProfile(userId);
        }
      });

      // دالة جلب بيانات العميل المتوافقة مع أسماء الـ IDs في الـ HTML
      async function fetchUserProfile(id) {
        try {
          const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getUser&id=${encodeURIComponent(id)}`, {
            method: "GET",
            redirect: "follow"
          });
          const data = await response.json();

          if (data.success) {
            document.getElementById("data-name").innerText = data.name || "غير محدد";
            document.getElementById("data-namber").innerText = data.phone || data.mobile || "غير محدد";
            document.getElementById("data-email").innerText = data.email || "غير محدد";
            document.getElementById("data-addres").innerText = data.address || "غير محدد";
            document.getElementById("data-id").innerText = id;
          } else {
            document.getElementById("data-name").innerText = "تعذر العثور على البيانات";
          }
        } catch (error) {
          console.error("خطأ في جلب بيانات العميل:", error);
          document.getElementById("data-name").innerText = "خطأ في الاتصال";
        }
      }

      // دالة تسجيل الخروج
      function logoutClient() {
        localStorage.removeItem("userRole");
        localStorage.removeItem("userId");
        window.location.replace("../login/index.html");
      }

      // 3. التحكم في القوائم والتنقل
      function togglemenu() {
        var menu = document.getElementById("menu-totaltop");
        if (menu) menu.classList.toggle("active");
      }

      function showsection(sectionId) {
        if (!sectionId) return;

        var sections = document.querySelectorAll("section");
        sections.forEach(function (sec) {
          sec.style.display = "none";
        });

        var targetSection = document.getElementById(sectionId);
        if (targetSection) {
          targetSection.style.display = "block";
        }

        var menu = document.getElementById("menu-totaltop");
        if (menu) {
          menu.classList.remove("active");
        }
      }

      // 4. إدارة السلة والتسوق
      let cart = JSON.parse(localStorage.getItem("my_app_cart")) || [];

      function addToCart(btn) {
        const card = btn.closest(".data-market-card") || btn.closest("article");
        const id = card.getAttribute("data-id") || card.querySelector("h2").innerText.trim();
        const title = card.querySelector("h2").innerText;
        const priceText = card.querySelector(".price").innerText;
        const price = parseFloat(priceText.replace(/[^0-9.]/g, "")) || 0;
        const imgSrc = card.querySelector("img").src;

        let existingItem = cart.find((item) => item.id === id);

        if (existingItem) {
          existingItem.qty += 1;
        } else {
          cart.push({ id: id, title: title, price: price, img: imgSrc, qty: 1 });
        }

        saveAndRefresh();
        alert('تمت إضافة "' + title + '" إلى السلة بنجاح!');
      }

      function updateBasketUI() {
        const container = document.getElementById("basket-inmarkrt");
        const totalSpan = document.getElementById("basket-span");

        if (!container || !totalSpan) return;

        container.innerHTML = "";
        let totalSum = 0;

        if (cart.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">السلة فارغة حالياً</p>';
          totalSpan.innerText = "0 جنيه";
          return;
        }

        cart.forEach((item, index) => {
          let itemTotal = item.price * item.qty;
          totalSum += itemTotal;

          container.innerHTML += `
            <div class="basket-card" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #ddd; padding-bottom:10px;">
                <img src="${item.img}" alt="${item.title}" style="width:50px; height:50px; object-fit:cover;">
                <div class="basket-card-details">
                    <h3>${item.title}</h3>
                    <p>السعر: ${item.price} جنيه</p>
                </div>
                <div class="quantity-control">
                    <button type="button" class="btn-qty" onclick="changeQuantity(${index}, -1)">-</button>
                    <input type="number" class="qty-input" value="${item.qty}" readonly style="width:40px; text-align:center;">
                    <button type="button" class="btn-qty" onclick="changeQuantity(${index}, 1)">+</button>
                </div>
                <div class="item-total-group">
                    <p class="item-total">${itemTotal} جنيه</p>
                    <button type="button" class="btn-remove" onclick="removeCartItem(${index})" style="background:red; color:white; border:none; padding:5px;">حذف</button>
                </div>
            </div>
          `;
        });

        totalSpan.innerText = totalSum + " جنيه";
      }

      function changeQuantity(index, change) {
        cart[index].qty += change;
        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }
        saveAndRefresh();
      }

      function removeCartItem(index) {
        cart.splice(index, 1);
        saveAndRefresh();
      }

      function saveAndRefresh() {
        localStorage.setItem("my_app_cart", JSON.stringify(cart));
        updateBasketUI();
      }

      // 5. تأكيد الشراء وإرسال الطلب للواتساب
      function sendInvoiceToWhatsApp() {
        if (cart.length === 0) {
          alert("السلة فارغة!");
          return;
        }

        const managerPhone = "201501893345";
        const invNum = "WEB-" + Math.floor(100000 + Math.random() * 900000);
        const dateStr = new Date().toLocaleDateString("ar-EG");
        const currentUserId = localStorage.getItem("userId") || "غير معروف";

        let itemsText = "";
        let totalSum = 0;

        cart.forEach((item, index) => {
          let itemTotal = item.price * item.qty;
          totalSum += itemTotal;
          itemsText += `${index + 1}. ${item.title} (كود: ${item.id}) - الكمية: ${item.qty} - الإجمالي: ${itemTotal} جنيه\n`;
        });

        let message = `*طلب جديد من الموقع 🛒*\n\n`;
        message += `*رقم العميل (ID):* ${currentUserId}\n`;
        message += `*رقم الفاتورة:* ${invNum}\n`;
        message += `*التاريخ:* ${dateStr}\n`;
        message += `-------------------------\n`;
        message += `*المنتجات:*\n${itemsText}`;
        message += `-------------------------\n`;
        message += `*الإجمالي الكلي:* ${totalSum} جنيه\n\n`;
        message += `يرجى تأكيد الطلب.`;

        const whatsappUrl = `https://wa.me/${managerPhone}?text=${encodeURIComponent(message)}`;

        cart = [];
        saveAndRefresh();
        window.location.href = whatsappUrl;
      }
    </script>
  </body>
</html>
