<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body>
    <header>
      <div class="longo-name">
        <img src="img/market.jpg" alt="logo" />
        <h3>مرحبا بكم</h3>
        <div class="name-clien">
          <h2 id="clien-name">اسم العميل</h2>
          <span class="clien-id">ID: <span id="clien-id-num">1024</span></span>
        </div>
      </div>
      <nav class="links">
        <a href="shop.html">المتجر</a>
        <a href="cart.html">السله</a>
        <a href="contact.html">تواصل معنا</a>
      </nav>
      <div class="longout">
        <a href="index.html"> تسجيل خروج</a>
      </div>
    </header>
    <!-- البحث والفلتر-->
    <main>
      <br />
      <h3 class="name-market">المنتاجات المتاحه</h3>
      <div class="name-add">
        <button class="name-add-cart" id="name-add-cart">اضافه صنف</button>
        <div class="name-add-car1" id="name-add-cart1">
          تمت إضافة المنتج إلى السلة بنجاح!
        </div>
        <div class="search-filter">
          <div class="search-cart">
            <input type="text" id="search-name" />
          </div>
          <div class="filter-cart">
            <select name="catt" id="name-filter-cart">
              <option value="all">اختر التصنيف</option>
              <option value="electronics" id="add-filter">إلكترونيات</option>
            </select>
          </div>
        </div>
        <div class="number-cart">
          <span
            >اجمالي المنتجات المتاحه :<strong class="number-carts"
              >1</strong
            ></span
          >
        </div>
      </div>
      <div class="cards-container">
       <!-- الكرت نفسو -->
      <div class="card">
        <div class="card-cart">
          <button><a href="">اضافه للعربه</a></button>
        </div>
        <div class="card-img">
          <img src="" alt="صوره المنتج" />
        </div>
        <div class="name">
          <h3 class="name-name"></h3>
          <span class="name-filter"></span>
          <!-- سعر المنتج -->
          <span class="name-prise"></span>
        </div>

        <div class="card-properts">
          <button><a href="">اظهار تفاصيل</a></button>
        </div>
      </div>
      </div>
    </main>
    <!-- اضافه كرت -->
    <section class="form" id="add-1">
      <div class="add-form">
        <h3>اضافه /تعديل صتف</h3>
        <div class="form-e">
          <label for="">ID</label>
          <input type="number" placeholder="أدخل اسم المنتج" />

          <label for="">اسم الصنف</label>
          <input type="text" placeholder="أدخل اسم المنتج" />

          <label for="">التصنيف</label>
          <input
            type="text"
            list="categories-list"
            placeholder="اختر أو اكتب تصنيف جديد..."
          />
          <datalist id="categories-list">
            <option value="أخرى"></option>
          </datalist>

          <label for="">السعر</label>
          <input type="number" placeholder=" أدخل السعر" />

          <label for="">رابط الصوره</label>
          <input type="file" />
          <input type="url">
        </div>
      </div>
      <div class="btn-card">
        <button class="btn-save-card">حفظ</button>
        <button class="btn-save-delet">حذف</button>
        <button class="btn-save-cancel">الغاء</button>
      </div>
    </section>
    <!-- ----------------- -->
    <!-- 1. مكتبات الفايربيس الأساسية -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- 2. ملف الاتصال الموحد -->
<script src="firebase-config.js"></script>
<!-- <script src="header.js"></script> -->

<!-- 3. ملف الجافاسكريبت الخاص بالصفحة الحالية -->
<script src="shop.js"></script> <!-- أو cart.js أو غيره -->
  </body>
</html>
