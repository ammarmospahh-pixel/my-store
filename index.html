<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متجر الكتروني</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="wight dark/wight darl.css" />
  </head>
  <body>
    <header>
      <div class="longo-name">
        <img src="img/market.jpg" alt="logo" />
        <h3>مرحبا بكم</h3>
        <!-- داتا الهميل ف الهدر -->
        <div class="name-clien">
          <div class="clien-Details">
            <div class="img-iduser">
              <span
              ><img
              src="img/2.png"
              alt="صوره شغصيه"
              id="user-img"
              style="cursor: pointer"
              /></span>
              <input
              type="url"
              class="img-id"
              id="uploud-img-user"
              accept="image/*"
              style="display: none"
              />
            </div>
            <span class="clien-id">الاسم:<span id="clien-name"></span></span>
            
            <span class="clien-id" >ID: <span id="clien-id-num"></span></span>
            <span class="clien-id2" >عنوان: <span id="clien-id-num2"></span></span>
            <span class="clien-id3">نسبه الخصم: <span id="clien-id-num3"></span></span>
          </div>
        </div>
      </div>
      <div class="name-add">
        <button class="name-add-cart" id="name-add-cart">اضافه صنف</button>
        <div class="name-add-car1" id="name-add-cart1">
          تمت إضافة المنتج إلى السلة بنجاح!
        </div>
        <div class="search-filter">
          <!-- البحث: 50% -->
          <div class="search-cart">
            <input
            type="text"
            id="search-name"
            placeholder="ابحث باسم الصنف أو الـ ID..."
            />
          </div>
          
          <!-- التصنيف: 30% -->
          <div class="filter-cart">
            <select name="catt" id="name-filter-cart">
              <option value="all">اختر التصنيف</option>
              <option value="electronics" id="add-filter">إلكترونيات</option>
            </select>
          </div>
        </div>
      </div>

      <!-- <div class="longout">
        <a href="index.html"> تسجيل خروج</a>
      </div> -->
    </header>

    <nav class="links">
      <a href="index.html">المتجر</a>
      <a href="cart.html">السله</a>
      <a href="contact.html">تواصل معنا</a>
      <!-- زر تبديل الوضع الداكن -->
    </nav>
    <nav class="links2">
    <button id="theme-toggle" class="theme-toggle-btn" title="تبديل الوضع">🌙</button>
    </nav>
    <!-- المنتجات -->
    <main>
      <div class="cards-container">
        <!-- الكرت يتم إنشاؤه برمجياً من الجافاسكريبت -->
      </div>
    </main>

    <!-- اضافه كرت -->
    <section class="form" id="add-1">
      <div class="add-form">
        <h3>اضافه / تعديل صنف</h3>
        <div class="form-e">
          <label for="">ID</label>
          <input type="number" placeholder="أدخل ID المنتج" />

          <label for="">اسم الصنف</label>
          <input type="text" placeholder="أدخل اسم المنتج" />

          <label for="">التصنيف</label>
          <input
            type="text"
            list="categories-list"
            placeholder="اختر أو اكتب تصنيف جديد..."
          />
          <datalist id="categories-list">
            <option value="أخرى"></option>
          </datalist>

          <label for="">السعر</label>
          <input type="number" placeholder="أدخل السعر" />

          <label for="">رابط الصوره</label>
          <!-- <input type="file" /> -->
          <input type="url" />
        </div>
      </div>
      <div class="btn-card">
        <button class="btn-save-card">حفظ</button>
        <button class="btn-save-delet">حذف</button>
        <button class="btn-save-cancel">الغاء</button>
      </div>
    </section>

    <!-- تفاصيل الكرت -->
    <section id="propertes-cart" class="propertes-cart-modal">
      <div class="propertes-cart-content">
        <button type="button" class="close-propertes-btn" id="close-propertes">
          &times;
        </button>

        <div class="propertes-main-grid">
          <!-- صورة البند (على اليمين) -->
          <div class="pro-cart-img">
            <img id="pro-img" src="" alt="صورة المنتج" />
          </div>

          <!-- بيانات البند والتفاصيل (على الشمال) -->
          <div class="pro-card-pro">
            <h2 id="pro-title" class="pro-title">اسم الصنف</h2>

            <div class="pro-info-list">
              <p><strong>التصنيف:</strong> <span id="pro-category"></span></p>
              <p><strong>السعر:</strong> <span id="pro-price"></span> ج.م</p>
            </div>

            <!-- مساحة كبيرة للتفاصيل -->
            <div class="pro-details-box">
              <h3>تفاصيل المنتج:</h3>
              <p id="pro-description">
                لا توجد تفاصيل إضافية مضافة لهذا المنتج.
              </p>

              <!-- نموذج التعديل المباشر (مخفي افتراضياً) -->
              <div
                id="edit-description-container"
                style="display: none; margin-top: 10px"
              >
                <textarea
                  id="pro-description-input"
                  rows="3"
                  style="
                    width: 100%;
                    border-radius: 8px;
                    padding: 8px;
                    border: 1px solid #ccc;
                    resize: vertical;
                    font-family: inherit;
                    box-sizing: border-box;
                  "
                ></textarea>
                <div style="display: flex; gap: 8px; margin-top: 8px">
                  <button
                    type="button"
                    id="save-description-btn"
                    style="
                      background-color: #2b82fb;
                      color: #fff;
                      border: none;
                      padding: 6px 14px;
                      border-radius: 6px;
                      cursor: pointer;
                      font-weight: bold;
                    "
                  >
                    حفظ
                  </button>
                  <button
                    type="button"
                    id="cancel-description-btn"
                    style="
                      background-color: #888;
                      color: #fff;
                      border: none;
                      padding: 6px 14px;
                      border-radius: 6px;
                      cursor: pointer;
                    "
                  >
                    إلغاء
                  </button>
                </div>
              </div>
            </div>

            <!-- أزرار التحكم -->
            <div class="pro-cart-pnt">
              <button type="button" id="pro-add-to-cart-btn">
                إضافة للعربة
              </button>
            </div>

            <!-- حاوية زر التعديل (تظهر فقط للأدمن) -->
            <div id="admin-edit-wrapper" style="display: none">
              <button type="button" id="pro-add-to-cart-btn2">
                كتابه / تعديل التفاصيل
              </button>
            </div>
          </div>
        </div>

        <hr class="modal-divider" />

        <!-- سكشن المنتجات المشابهة -->
        <div class="related-products-section">
          <h3>منتجات من نفس التصنيف</h3>
          <div
            class="related-cards-container"
            id="related-products-container"
          ></div>
        </div>
      </div>
    </section>

    <!-- مكتبات الفايربيس والملفات البرمجية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="cart.js"></script>
    <script src="index.js"></script>
    <script src="header.js"></script>
    <script src="wight dark/wight darl.js"></script>
  </body>
</html>
