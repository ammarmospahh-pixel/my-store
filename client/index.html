<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاشة العميل</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="header-top-pro">
          <img src="img/logo.png" alt="logo" />
          <h2>شاشة العميل</h2>
        </div>
        <button class="headermenu" onclick="togglemenu()">☰</button>
      </div>
      <nav class="menu-total" id="menu-totaltop">
        <button onclick="showsection('home-clian')">HOME</button>
        <button onclick="showsection('data-clian')">بيانات العميل</button>
        <button onclick="showsection('data-market')">المتجر</button>
        <button onclick="showsection('data-basket')">السلة</button>
        <button onclick="showsection('')">فواتير سابقة</button>
        <button onclick="logoutClient()">تسجيل خروج</button>
      </nav>
    </header>

    <section id="home-clian">
      <h2>مرحبا بكم</h2>
      <div class="home-1">
        <img src="img/logo.png" alt="صورة اعلان عروض" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">إعلان عروض</h3>
          <button class="home-but1" onclick="showsection('')">دخول</button>
        </div>
      </div>
      <div class="home-2">
        <img src="img/logo.png" alt="صورة اعلان عروض" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">للمتجر</h3>
          <button class="home-but1" onclick="showsection('data-market')">
            دخول
          </button>
        </div>
      </div>
      <div class="home-1">
        <img src="img/logo.png" alt="صورة اعلان عروض" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">العميل</h3>
          <button class="home-but1" onclick="showsection('data-clian')">
            دخول
          </button>
        </div>
      </div>
      <div class="home-2">
        <img src="img/logo.png" alt="صورة اعلان عروض" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">السلة</h3>
          <button class="home-but1" onclick="showsection('data-basket')">
            دخول
          </button>
        </div>
      </div>
      <div class="home-1">
        <img src="img/logo.png" alt="صورة اعلان عروض" class="home-pag1" />
        <div class="dishome">
          <h3 class="home-script1">فواتير</h3>
          <button class="home-but1" onclick="showsection('')">دخول</button>
        </div>
      </div>
    </section>

    <section id="data-clian" style="display: none">
      <h2>بيانات العميل</h2>
      <div class="show-data">
        <label for="">الاسم</label>
        <span id="data-name">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label for="">رقم الهاتف</label>
        <span id="data-namber">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label for="">بريد الكتروني</label>
        <span id="data-email">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label for="">العنوان</label>
        <span id="data-addres">جاري التحميل...</span>
      </div>
      <div class="show-data">
        <label for="">الرقم الخاص (ID)</label>
        <span id="data-id">جاري التحميل...</span>
      </div>
    </section>

    <section id="data-market" style="display: none">
      <h2>المتجر</h2>
      <div class="data-market-cardgrop">
        <article class="data-market-card" data-id="A1001">
          <img src="img/logo.png" alt="صنف1 جديد" />
          <div class="incard">
            <h2>صنف 1</h2>
            <p class="price">150 جنيه</p>
            <button class="butmarket" onclick="addToCart(this)">
              اضافه للسلة
            </button>
          </div>
        </article>
        <article class="data-market-card" data-id="A1002">
          <img src="img/logo.png" alt="صنف جديد" />
          <div class="incard">
            <h2>صنف 2</h2>
            <p class="price">200 جنيه</p>
            <button class="butmarket" onclick="addToCart(this)">
              اضافه للسلة
            </button>
          </div>
        </article>
        <article class="data-market-card" data-id="A1003">
          <img src="img/logo.png" alt="صنف2 جديد" />
          <div class="incard">
            <h2>صنف 3</h2>
            <p class="price">250 جنيه</p>
            <button class="butmarket" onclick="addToCart(this)">
              اضافه للسلة
            </button>
          </div>
        </article>
      </div>
    </section>

    <section id="data-basket" style="display: none">
      <h2>السلة</h2>
      <form action="" id="basket-form" onsubmit="event.preventDefault()">
        <div id="basket-inmarkrt"></div>
        <div class="basket-total">
          <h3>ملخص الطلب</h3>
          <div class="basket-total2">
            <span>اجمالي الحساب: </span>
            <span id="basket-span">0 جنيه</span>
          </div>
          <button
            type="button"
            class="but-checkout"
            onclick="sendInvoiceToWhatsApp()"
          >
            تاكيد الشراء
          </button>
        </div>
      </form>
    </section>

    <script>
      // ==========================================
      // 1. حماية الوصول لصفحة العميل
      // ==========================================
      (function enforceClientAuth() {
        const userRole = (localStorage.getItem("userRole") || "").toLowerCase().trim();
        const userId = localStorage.getItem("userId");

        // إذا لم يكن مسجلاً كعميل يتم التوجيه لصفحة تسجيل الدخول فوراً
        if (!userId || userRole !== "client") {
          alert("يرجى تسجيل الدخول أولاً للوصول إلى هذه الصفحة!");
          window.location.replace("../login/index.html");
        }
      })();

      // ==========================================
      // 2. التحميل الأولي للبيانات والسلة
      // ==========================================
      document.addEventListener("DOMContentLoaded", function () {
        const userId = localStorage.getItem("userId");

        updateBasketUI();

        if (userId) {
          fetchUserProfile(userId);
        }
      });

      // دالة جلب البيانات الخاصة بالعميل من Google Apps Script
      async function fetchUserProfile(id) {
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzllkAlRUE4tciAvkkLbK3RHXpZDWGgjHQyORN3D736Z4nmLJcjjaz_w-adumZsKyeT/exec";

        try {
          const response = await fetch(`${SCRIPT_URL}?id=${encodeURIComponent(id)}`);
          const data = await response.json();

          if (data.status === "success") {
            if (document.getElementById("data-name")) document.getElementById("data-name").innerText = data.name || "غير محدد";
            if (document.getElementById("data-namber")) document.getElementById("data-namber").innerText = data.phone || data.mobile || "غير محدد";
            if (document.getElementById("data-email")) document.getElementById("data-email").innerText = data.email || "غير محدد";
            if (document.getElementById("data-addres")) document.getElementById("data-addres").innerText = data.address || "غير محدد";
            if (document.getElementById("data-id")) document.getElementById("data-id").innerText = id;
          }
        } catch (error) {
          console.error("خطأ في جلب بيانات العميل:", error);
        }
      }

      // دالة تسجيل الخروج للعميل
      function logoutClient() {
        localStorage.removeItem("userRole");
        localStorage.removeItem("userId");
        window.location.replace("../login/index.html");
      }

      // ==========================================
      // 3. التحكم في القوائم والتنقل
      // ==========================================
      function togglemenu() {
        var menu = document.getElementById("menu-totaltop");
        if (menu) menu.classList.toggle("active");
      }

      function showsection(sectionId) {
        if (!sectionId) return;

        var sections = document.querySelectorAll("section");
        sections.forEach(function (sec) {
          sec.style.display = "none";
        });

        var targetSection = document.getElementById(sectionId);
        if (targetSection) {
          targetSection.style.display = "block";
        }

        var menu = document.getElementById("menu-totaltop");
        if (menu) {
          menu.classList.remove("active");
        }
      }

      // ==========================================
      // 4. إدارة السلة والتسوق
      // ==========================================
      let cart = JSON.parse(localStorage.getItem("my_app_cart")) || [];

      function addToCart(btn) {
        const card = btn.closest(".data-market-card") || btn.closest("article");
        const id = card.getAttribute("data-id") || card.querySelector("h2").innerText.trim();
        const title = card.querySelector("h2").innerText;
        const priceText = card.querySelector(".price").innerText;
        const price = parseFloat(priceText.replace(/[^0-9.]/g, "")) || 0;
        const imgSrc = card.querySelector("img").src;

        let existingItem = cart.find((item) => item.id === id);

        if (existingItem) {
          existingItem.qty += 1;
        } else {
          cart.push({
            id: id,
            title: title,
            price: price,
            img: imgSrc,
            qty: 1,
          });
        }

        saveAndRefresh();
        alert('تمت إضافة "' + title + '" إلى السلة بنجاح!');
      }

      function updateBasketUI() {
        const container = document.getElementById("basket-inmarkrt");
        const totalSpan = document.getElementById("basket-span");

        if (!container || !totalSpan) return;

        container.innerHTML = "";
        let totalSum = 0;

        if (cart.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">السلة فارغة حالياً</p>';
          totalSpan.innerText = "0 جنيه";
          return;
        }

        cart.forEach((item, index) => {
          let itemTotal = item.price * item.qty;
          totalSum += itemTotal;

          container.innerHTML += `
            <div class="basket-card">
                <img src="${item.img}" alt="${item.title}">
                <div class="basket-card-details">
                    <h3>${item.title}</h3>
                    <p>السعر: ${item.price} جنيه</p>
                </div>
                <div class="quantity-control">
                    <button type="button" class="btn-qty" onclick="changeQuantity(${index}, -1)">-</button>
                    <input type="number" class="qty-input" value="${item.qty}" readonly>
                    <button type="button" class="btn-qty" onclick="changeQuantity(${index}, 1)">+</button>
                </div>
                <div class="item-total-group">
                    <p class="item-total">${itemTotal} جنيه</p>
                    <button type="button" class="btn-remove" onclick="removeCartItem(${index})">حذف 🗑️</button>
                </div>
            </div>
          `;
        });

        totalSpan.innerText = totalSum + " جنيه";
      }

      function changeQuantity(index, change) {
        cart[index].qty += change;
        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }
        saveAndRefresh();
      }

      function removeCartItem(index) {
        cart.splice(index, 1);
        saveAndRefresh();
      }

      function saveAndRefresh() {
        localStorage.setItem("my_app_cart", JSON.stringify(cart));
        updateBasketUI();
      }

      // ==========================================
      // 5. تأكيد الشراء وإرسال الفاتورة
      // ==========================================
      function sendInvoiceToWhatsApp() {
        if (cart.length === 0) {
          alert("السلة فارغة!");
          return;
        }

        const managerPhone = "201501893345";
        const invNum = "WEB-" + Math.floor(100000 + Math.random() * 900000);
        const dateStr = new Date().toLocaleDateString("ar-EG");
        const currentUserId = localStorage.getItem("userId") || "غير معروف";

        let itemsText = "";
        let totalSum = 0;
        let sheetItems = [];

        cart.forEach((item, index) => {
          let itemTotal = item.price * item.qty;
          totalSum += itemTotal;
          itemsText += `${index + 1}. ${item.title} (كود: ${item.id}) - الكمية: ${item.qty} - السعر: ${itemTotal} جنيه\n`;

          sheetItems.push({
            id: item.id,
            title: item.title,
            qty: item.qty,
            price: item.price,
            itemTotal: itemTotal
          });
        });

        const invoicePayload = {
          invNum: invNum,
          dateStr: dateStr,
          totalSum: totalSum,
          items: sheetItems,
          clientId: currentUserId
        };

        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbwcneFnCPG_fCnAQp8RLoyWfobM9SW2bzARjSqf4duSJjhgsL3QaZVsa5rT6FbhDA7K2A/exec";

        let message = `*طلب جديد من الويب سايت 🛒*\n\n`;
        message += `*رقم العميل:* ${currentUserId}\n`;
        message += `*رقم الفاتورة:* ${invNum}\n`;
        message += `*التاريخ:* ${dateStr}\n`;
        message += `-------------------------\n`;
        message += `*المنتجات:*\n${itemsText}`;
        message += `-------------------------\n`;
        message += `*الإجمالي:* ${totalSum} جنيه\n\n`;
        message += `برجاء تأكيد الطلب.`;

        const whatsappUrl = `https://wa.me/${managerPhone}?text=${encodeURIComponent(message)}`;

        fetch(googleScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(invoicePayload)
        })
        .finally(() => {
          cart = [];
          saveAndRefresh();
          window.location.href = whatsappUrl;
        });
      }
    </script>
  </body>
</html>
